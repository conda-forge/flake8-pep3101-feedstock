{% set name = "flake8-pep3101" %}
{% set version = "3.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 03d6a3503391cb0fe4cca838767443deb5185c5c1d9876d6aae73e7d7f890461

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - flake8

test:
  requires:
    - python {{ python_min }}
  commands:
    - 'flake8 --version | grep flake8-pep3101:'

about:
  home: https://github.com/gforcada/flake8-pep3101
  license: GPL-2.0-only
  license_family: GPL2
  license_file: LICENSE
  summary: Check for uses of old % formatting rather than .format() method
  dev_url: https://github.com/gforcada/flake8-pep3101

extra:
  recipe-maintainers:
    - dopplershift
